global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: caliber-api
    static_configs:
      - targets: ["api:8080"]
    metrics_path: /metrics

  - job_name: caliber-worker
    static_configs:
      - targets: ["worker:8081"]
    metrics_path: /metrics
