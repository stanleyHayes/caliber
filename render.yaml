# =============================================================================
# Project Caliber — Render Blueprint (Infrastructure as Code, CAL-150)
#
# Codifies the BACKEND on Render: a managed Key-Value (Redis) store and the `api`
# (web) + `worker` services built from the existing deploy/Dockerfile.{api,worker}.
# The database is EXTERNAL: a free Neon Postgres (pgvector), not a Render managed
# DB — Render's free Postgres expires after 30 days, whereas Neon's free tier is
# permanent, so CALIBER_DATABASE_URL is set as a secret pointing at Neon (see the
# DATABASE section below). The FRONTEND is deployed to Vercel and is codified
# separately (CAL-152); local topology lives in docker-compose.yml. See
# docs/infrastructure.md for the full map + apply steps.
#
# HONESTY / VALIDATION NOTE
#   This file cannot be applied or validated inside the build sandbox. Render's
#   Blueprint schema evolves; VALIDATE THIS AGAINST RENDER'S CURRENT BLUEPRINT
#   SPEC (https://render.com/docs/blueprint-spec) before applying, and confirm
#   the exact plan names/regions available to the account. Field names such as
#   `databases[].postgresMajorVersion`, the pgvector extension enablement, and
#   the Key-Value (Redis) block have changed names across Render revisions.
#
# SECRETS
#   Real secrets are NEVER stored here. Values wired with `sync: false` are set
#   once per environment in the Render dashboard / secret store and rotated per
#   docs/runbooks/secret-rotation.md. The Redis URL is injected by Render via
#   fromService; the DB DSN (external Neon) is a `sync: false` secret set in the
#   dashboard — never hand-entered here.
#   Per-env value templates: .env.staging.example / .env.production.example;
#   the full tunable list is .env.example; env topology is docs/environments.md.
#
# DATABASE (external — Neon)
#   The app is Postgres + pgvector and swaps hosts by connection string alone, so
#   the DB is NOT a Render managed database. Create a free Neon project
#   (https://neon.tech), enable pgvector is automatic — our goose migration
#   00001_extensions.sql runs `CREATE EXTENSION IF NOT EXISTS vector`), and set the
#   CALIBER_DATABASE_URL secret on BOTH services below to Neon's connection string.
#   IMPORTANT DSN rules:
#     • include ?sslmode=require (Neon requires TLS);
#     • use Neon's DIRECT (non-pooled) endpoint, not the -pooler host — pgx
#       prepared statements + the optional hnsw.ef_search hook don't work behind a
#       transaction pooler.
#   To revert to a Render managed DB instead: add back a `databases:` block with a
#   `- name: caliber-postgres` (plan: basic-256mb — free expires in 30 days) and
#   change the two CALIBER_DATABASE_URL entries to
#   `fromDatabase: {name: caliber-postgres, property: connectionString}`.
#
# MIGRATIONS
#   Schema migrations are NOT run by the api/worker at boot. Run them with goose
#   from deploy/Dockerfile.migrate (`/migrate up`) against CALIBER_DATABASE_URL.
#   On the api's FREE plan Render does not run pre-deploy commands, so run the
#   migrate image once as a one-off job before first boot (and after any new
#   migration). On a PAID api plan you can re-enable the `preDeployCommand` below
#   to migrate automatically each deploy. See docs/infrastructure.md § Migrations.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Managed Key-Value (Redis) store — Asynq queue + rate-limit/cache backing.
  # Render models Redis as a `redis` service type (a.k.a. "Key Value").
  # ---------------------------------------------------------------------------
  - type: redis
    name: caliber-redis
    plan: free                 # free Key Value (25MB, NO persistence). Fine for a POC:
                               # queued jobs are lost on a restart and enqueue fails if
                               # the 25MB fills. Move to a paid plan for durable queues.
    region: oregon             # must match the DB + app services' region
    ipAllowList: []            # empty = only Render internal network may connect
    maxmemoryPolicy: noeviction # Asynq requires jobs are never evicted

  # ---------------------------------------------------------------------------
  # API (REST gateway + gRPC + health). Built from deploy/Dockerfile.api.
  # /readyz and /healthz are served on the HTTP port (CALIBER_HTTP_ADDR).
  # ---------------------------------------------------------------------------
  - type: web
    name: caliber-api
    runtime: docker            # build the image from the Dockerfile below.
                               # (runtime: image is only for pulling a PREBUILT image
                               # from a registry and forbids dockerfilePath/dockerContext.)
    region: oregon
    plan: free                 # free web service. NOTE: spins down after ~15 min idle,
                               # so the first request after idle cold-starts (can take
                               # up to a minute). Bump to starter to keep it always-on.
    dockerfilePath: ./deploy/Dockerfile.api
    dockerContext: .
    healthCheckPath: /readyz   # httpserver router.go: r.Get("/readyz", ...)
    # Pre-deploy DB migration step (goose). DISABLED because the api is on the free
    # plan and Render does NOT run pre-deploy commands on free instances. On free,
    # run migrations once as a one-off job from the migrate image before first boot
    # (Render dashboard → Jobs, or `render jobs create` with deploy/Dockerfile.migrate
    # running `/migrate up`); the api's /readyz will stay red until the schema exists.
    # If you move the api to a PAID plan, uncomment the line below to migrate
    # automatically on each deploy. VALIDATE first: preDeployCommand runs inside the
    # SERVICE image — confirm it contains /migrate + db/migrations, else keep using
    # the separate migrate job (docs/infrastructure.md § Migrations).
    # preDeployCommand: "/migrate up"
    envVars:
      - key: CALIBER_ENV
        value: production
      - key: CALIBER_LOG_LEVEL
        value: info
      # Render sets $PORT; the API's HTTP/health server must bind it.
      - key: CALIBER_HTTP_ADDR
        value: ":10000"        # VALIDATE against Render's injected $PORT
      - key: CALIBER_GRPC_ADDR
        value: ":9090"
      # Redis URL is injected by Render; the DB URL is the EXTERNAL Neon DSN (set
      # once in the dashboard, see the DATABASE header for the DSN rules).
      - key: CALIBER_DATABASE_URL
        sync: false            # Neon Postgres DSN — include ?sslmode=require and use
                               # Neon's DIRECT (non-pooled) endpoint.
      - key: CALIBER_REDIS_URL
        fromService:
          type: redis
          name: caliber-redis
          property: connectionString
      # Build/version correlation for traces + Report Card provenance. Render
      # injects the deploy's commit SHA as the built-in RENDER_GIT_COMMIT env
      # var automatically (Blueprint cannot interpolate it into another var, and
      # fromService.property only exposes host/port/connectionString — not the
      # commit). Set CALIBER_SERVICE_VERSION in the dashboard to RENDER_GIT_COMMIT
      # if version correlation is needed, otherwise it defaults to "dev" in code.
      # ---- Real secrets: set in the Render dashboard, never in the repo ----
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CALIBER_JWT_SECRET
        sync: false            # >=32 bytes, unique per env (secret-rotation.md)
      - key: CALIBER_CORS_ORIGINS
        sync: false            # the Vercel origin, e.g. https://calibergh.vercel.app
      - key: CALIBER_FIELD_ENCRYPTION_KEY
        sync: false            # base64 32-byte AES-256 key — candidate PII at rest (CAL-117);
                               # without it, PII is stored in plaintext. Rotate per
                               # docs/runbooks/key-rotation.md.

  # ---------------------------------------------------------------------------
  # Worker (Asynq consumer). Built from deploy/Dockerfile.worker. No inbound
  # HTTP; exposes Prometheus metrics on CALIBER_WORKER_METRICS_ADDR (:8081).
  # Modeled as a background worker (no public port / health check).
  # ---------------------------------------------------------------------------
  - type: worker
    name: caliber-worker
    runtime: docker            # build from the Dockerfile below (not a prebuilt image).
    region: oregon
    plan: starter              # background workers have NO free tier on Render, so this
                               # is the cheapest option. (If you want a zero-cost demo,
                               # you can drop the worker and run screening synchronously,
                               # but async scoring/retention needs this process.)
    dockerfilePath: ./deploy/Dockerfile.worker
    dockerContext: .
    envVars:
      - key: CALIBER_ENV
        value: production
      - key: CALIBER_LOG_LEVEL
        value: info
      - key: CALIBER_WORKER_METRICS_ADDR
        value: ":8081"
      # Same external Neon DB + Render Redis as the api service. Set
      # CALIBER_DATABASE_URL to the SAME Neon DSN you set on the api.
      - key: CALIBER_DATABASE_URL
        sync: false            # Neon Postgres DSN (see the DATABASE header).
      - key: CALIBER_REDIS_URL
        fromService:
          type: redis
          name: caliber-redis
          property: connectionString
      # CALIBER_SERVICE_VERSION: Render injects RENDER_GIT_COMMIT automatically;
      # set it in the dashboard if version correlation is needed (see api note).
      # ---- Real secrets: set in the Render dashboard, never in the repo ----
      # The worker runs the AI orchestration + retention sweep, so it needs the
      # same model keys and JWT secret as the api. CORS is api-only.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CALIBER_JWT_SECRET
        sync: false
      - key: CALIBER_FIELD_ENCRYPTION_KEY
        sync: false            # SAME key as the api — the worker also reads/writes
                               # candidate PII (interview scoring, retention sweep).
