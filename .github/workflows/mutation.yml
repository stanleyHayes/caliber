name: Mutation testing

# Mutation testing is slow (it reruns the tests once per mutant), so it runs on a
# weekly schedule and on demand rather than on every PR — it tracks test *strength*
# over time (CAL-144), it is not a merge gate. `make mutation` fails if the kill
# rate drops below the floor in .gremlins.yaml, surfacing a real weakening of the
# domain tests.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation testing (domain)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@latest
      - name: Run mutation testing over the domain
        run: make mutation
