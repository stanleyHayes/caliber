name: Load test (k6)

on:
  schedule:
    # Nightly load-test run at 04:42 UTC.
    - cron: "42 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-test:
    name: k6 load test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run k6 load test
        run: make test-load

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-summary
          path: tests/load/results/k6-summary.txt
          retention-days: 7
