syntax = "proto3";

package caliber.v1;

import "caliber/v1/common.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// Audit trail — human approvals, overrides, and agent actions (EPIC-12).
// Append-only; underpins the human-in-the-loop and explainability story.
service AuditService {
  rpc ListAuditLog(ListAuditLogRequest) returns (ListAuditLogResponse) {
    option (google.api.http) = {get: "/v1/audit-log"};
  }
  rpc ExportAuditReport(ExportAuditReportRequest) returns (ExportAuditReportResponse) {
    option (google.api.http) = {get: "/v1/audit-log/export"};
  }
}

message AuditEntry {
  string id = 1;
  string actor_user_id = 2;
  string action = 3;       // e.g. "approve_rejection", "override_score", "agent_submit"
  string entity = 4;       // entity type
  string entity_id = 5;
  string before_json = 6;  // snapshot before
  string after_json = 7;   // snapshot after
  google.protobuf.Timestamp timestamp = 8;
}

message ListAuditLogRequest {
  string entity = 1;     // optional filter
  string entity_id = 2;  // optional filter
  PageRequest page = 3;
}
message ListAuditLogResponse {
  repeated AuditEntry entries = 1;
  PageResponse page = 2;
}

// ExportFormat selects the serialization for an audit-log report.
enum ExportFormat {
  EXPORT_FORMAT_UNSPECIFIED = 0;
  EXPORT_FORMAT_JSON = 1;
  EXPORT_FORMAT_CSV = 2;
}

message ExportAuditReportRequest {
  google.protobuf.Timestamp start_time = 1;   // inclusive
  google.protobuf.Timestamp end_time = 2;     // inclusive
  repeated string actions = 3;                // optional; empty = all actions
  repeated string entities = 4;               // optional; empty = all entities
  ExportFormat format = 5;                    // JSON or CSV
}

message ExportAuditReportResponse {
  bytes payload = 1;        // encoded report body
  string filename = 2;      // suggested download filename
  string content_type = 3;  // e.g. application/json or text/csv
}
