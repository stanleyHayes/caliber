# Project Caliber — SonarCloud analysis wiring (CAL-145)
#
# VALIDATE BEFORE APPLYING: this file only *wires* analysis (sources, tests,
# coverage imports, exclusions). It cannot be executed/verified in this sandbox.
# Confirm every key against SonarCloud's current analysis-parameters schema
# (https://docs.sonarsource.com/sonarcloud/) before relying on it — deprecated or
# renamed keys are silently ignored by the scanner, which weakens the gate.
#
# The quality GATE, quality PROFILES, and security-hotspot rules are configured
# in the SonarCloud project UI, NOT here — see docs/sonarqube.md for the intended
# profile/gate/new-code settings and how to reproduce them. This properties file
# is the source of truth only for what the scanner reads and where coverage comes
# from. CI invokes it via the SonarQube scan action in .github/workflows/ci.yml
# (backend job), which requires the SONAR_TOKEN secret (see below).

sonar.projectKey=xcreativs_caliber
sonar.projectName=Project Caliber
sonar.organization=xcreativs

# ---------------------------------------------------------------------------
# Sources & tests
# ---------------------------------------------------------------------------
# The scan runs over the whole repo (Go backend + web/ TypeScript SPA). We keep
# a single root scan so cross-language duplication and the overall gate apply to
# both languages; per-language behavior is steered by inclusions/exclusions.
sonar.sources=.
sonar.tests=.

# Test file patterns per language. Go table tests live beside code as *_test.go;
# the web suite uses Vitest (*.test.ts[x] / *.spec.ts[x]) plus Playwright e2e.
sonar.test.inclusions=**/*_test.go,web/src/**/*.test.ts,web/src/**/*.test.tsx,web/src/**/*.spec.ts,web/src/**/*.spec.tsx

# Language hints (help the scanner when a root scan spans multiple ecosystems).
sonar.go.file.suffixes=.go
sonar.typescript.file.suffixes=.ts,.tsx
sonar.javascript.file.suffixes=.js,.jsx,.cjs,.mjs

# ---------------------------------------------------------------------------
# Global analysis exclusions
# ---------------------------------------------------------------------------
# Exclude from ALL analysis (issues, duplication, size): generated protobuf/gRPC
# gateway code (internal/gen + *.pb.go/*.pb.gw.go), sqlc-generated DB layer
# (sqlcdb), hand-maintained port mocks (internal/mocks), generated OpenAPI docs,
# and the entire web build/dependency/report output. These are not authored code
# and would otherwise inflate LOC, dilute coverage, and trip duplication.
# NOTE: kept on one line — comma-separated pattern lists must not contain spaces,
# so avoid backslash line-continuations here (some scanner versions retain the
# leading indentation as part of the pattern, which then matches nothing).
sonar.exclusions=internal/gen/**,internal/mocks/**,internal/adapters/outbound/postgres/sqlcdb/**,docs/openapi/**,**/*.pb.go,**/*.pb.gw.go,**/mock_*.go,web/node_modules/**,web/dist/**,web/coverage/**,web/playwright-report/**,web/test-results/**,web/public/**,web/**/*.d.ts

# ---------------------------------------------------------------------------
# Coverage import
# ---------------------------------------------------------------------------
# Go: `go test -coverprofile=coverage.out ./...` (make test) at repo root.
sonar.go.coverage.reportPaths=coverage.out

# TypeScript/JavaScript: Vitest (v8 provider) LCOV report. NOTE — the web Vitest
# config must emit an 'lcov' reporter for this file to exist; add 'lcov' to
# web/vite.config.ts coverage.reporter (see docs/sonarqube.md). Path is relative
# to this properties file (repo root).
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.typescript.lcov.reportPaths=web/coverage/lcov.info

# Files/paths excluded from the COVERAGE metric only (still analyzed for issues).
# Mirrors the Go make COVERAGE_EXCLUDES and the web Vitest coverage.exclude so the
# reported % matches the gate the team already enforces locally/in CI.
sonar.coverage.exclusions=internal/gen/**,internal/mocks/**,internal/platform/migrate/**,internal/adapters/outbound/postgres/sqlcdb/**,cmd/**,tests/**,**/*_test.go,web/src/main.tsx,web/src/test-setup.ts,web/src/i18n/index.ts,web/scripts/**,web/e2e/**,web/**/*.test.ts,web/**/*.test.tsx,web/**/*.spec.ts,web/**/*.spec.tsx

# ---------------------------------------------------------------------------
# Duplication
# ---------------------------------------------------------------------------
# Generated/mock/DB code is already dropped via sonar.exclusions above, so it is
# not eligible for duplication either. Vitest snapshot-style test files legitimately
# repeat fixtures; keep them out of the duplication density metric.
sonar.cpd.exclusions=**/*_test.go,web/**/*.test.ts,web/**/*.test.tsx,web/**/*.spec.ts,web/**/*.spec.tsx,proto/**

# ---------------------------------------------------------------------------
# Quality gate / new-code (analysis-side wiring)
# ---------------------------------------------------------------------------
# The gate DEFINITION lives in the SonarCloud UI (docs/sonarqube.md). These keys
# only control scanner behavior around it:
#  - qualitygate.wait=true makes the CI scan block until the gate result is known
#    and fail the pipeline on a red gate (house standard: gate is enforcing, not
#    advisory). The scan step in ci.yml runs on every push.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=600

# New-Code Period is set in the UI to "Previous version" / reference branch = main
# so the "Clean as You Code" gate applies to each PR's changed lines. Documented,
# not settable via this file on SonarCloud; listed here for traceability only.
# sonar.newCode.referenceBranch=main   # (informational — configure in UI)

# SCM provider for accurate new-code / blame attribution.
sonar.scm.provider=git

# ---------------------------------------------------------------------------
# Auth (do NOT put the token here)
# ---------------------------------------------------------------------------
# A SonarCloud account under the `xcreativs` org and a project analysis token are
# required to publish results and enforce the gate. The token is supplied to CI as
# the SONAR_TOKEN secret (GitHub Actions secret; the scan step is gated on it in
# .github/workflows/ci.yml). It is NOT a runtime app secret and is intentionally
# absent from .env*.example / docs/environments.md; treat/rotate it like the other
# CI third-party credentials per docs/runbooks/secret-rotation.md.
